# Publie l'application sur GitHub Pages à chaque poussée.
#
# Le site déployé est le build complet : les images de `src/assets/` restent
# des fichiers servis séparément, mis en cache par le navigateur, plutôt que
# d'être encodées en base64 dans la page. Vite génère des chemins relatifs
# (`base: './'`), ce qui rend le site insensible au sous-chemin sur lequel
# Pages l'héberge.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/fitness-nutrition-app-5e6h93]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées suivantes remplacent la précédente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      # Playwright n'est utilisé que par le test de fumée, en local.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests des moteurs métier
        run: npm test

      - name: Construire
        run: npm run build
        env:
          # Identifiants clients Apple et Google. Ce ne sont pas des secrets :
          # ils sont publics par construction et vivent donc dans les
          # *variables* du dépôt (Settings → Secrets and variables → Actions →
          # Variables), pas dans les secrets. Absents, l'écran de connexion
          # désactive les deux boutons et le dit.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_APPLE_CLIENT_ID: ${{ vars.VITE_APPLE_CLIENT_ID }}
          VITE_APPLE_REDIRECT_URI: ${{ vars.VITE_APPLE_REDIRECT_URI }}

          # Mentions légales obligatoires. Elles désignent une personne réelle
          # et ne peuvent donc pas être devinées : tant qu'elles manquent,
          # l'écran « Informations légales » affiche à leur place le nom de la
          # mention et le texte de loi qui l'impose, et indique que le service
          # n'est pas publiable en l'état. Ce sont des mentions destinées à
          # être publiques : des variables, pas des secrets.
          VITE_LEGAL_NAME: ${{ vars.VITE_LEGAL_NAME }}
          VITE_LEGAL_FORM: ${{ vars.VITE_LEGAL_FORM }}
          VITE_LEGAL_CAPITAL: ${{ vars.VITE_LEGAL_CAPITAL }}
          VITE_LEGAL_ADDRESS: ${{ vars.VITE_LEGAL_ADDRESS }}
          VITE_LEGAL_REGISTRATION: ${{ vars.VITE_LEGAL_REGISTRATION }}
          VITE_LEGAL_VAT: ${{ vars.VITE_LEGAL_VAT }}
          VITE_LEGAL_DIRECTOR: ${{ vars.VITE_LEGAL_DIRECTOR }}
          VITE_LEGAL_EMAIL: ${{ vars.VITE_LEGAL_EMAIL }}
          VITE_LEGAL_PHONE: ${{ vars.VITE_LEGAL_PHONE }}
          VITE_LEGAL_HOST_NAME: ${{ vars.VITE_LEGAL_HOST_NAME }}
          VITE_LEGAL_HOST_ADDRESS: ${{ vars.VITE_LEGAL_HOST_ADDRESS }}
          VITE_LEGAL_HOST_PHONE: ${{ vars.VITE_LEGAL_HOST_PHONE }}
          VITE_LEGAL_PRIVACY_EMAIL: ${{ vars.VITE_LEGAL_PRIVACY_EMAIL }}
          VITE_LEGAL_MEDIATOR: ${{ vars.VITE_LEGAL_MEDIATOR }}
          VITE_LEGAL_MEDIATOR_URL: ${{ vars.VITE_LEGAL_MEDIATOR_URL }}
          VITE_LEGAL_SITE_URL: ${{ vars.VITE_LEGAL_SITE_URL }}

      - name: Préparer le site
        run: |
          # Empêche Jekyll d'ignorer les fichiers commençant par un underscore.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
